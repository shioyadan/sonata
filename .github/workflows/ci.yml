name: Verify and publish Sonata

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check source formatting
        run: npm run format:check
      - name: Check TypeScript boundaries
        run: npm run typecheck
      - name: Check replay model and portable HTML build
        run: npm test
      - name: Check preview server and malformed requests
        run: npm run test:server
      - name: Check desktop, mobile, touch and offline playback
        run: |
          set -o pipefail
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 1600x1100x24' npm run test:render 2>&1 | tee artifacts/ci-render.log
      - name: Report rendering failure
        if: failure()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'artifacts/ci-render.log';
          if (fs.existsSync(file)) {
            // 詳細ログへアクセスできない場合も、元のエラーを公開の検査注釈から確認できるようにする。
            const tail = fs.readFileSync(file, 'utf8').trimEnd().split('\n').slice(-60).join('\n').slice(-10000);
            const escaped = tail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            process.stdout.write('::error title=Rendering failure::' + escaped + '\n');
          }
          NODE

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # 検証済みのコミットを Node だけでビルドし、実行時の依存パッケージは含めない。
      - name: Build the live demo
        run: |
          npm run build
          mkdir -p artifacts/pages
          cp dist/sonata.html artifacts/pages/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/pages
      - name: Publish the verified demo
        id: deployment
        uses: actions/deploy-pages@v5
