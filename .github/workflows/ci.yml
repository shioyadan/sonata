name: Verify Sonata

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check replay model and portable HTML build
        run: npm test
      - name: Check desktop, mobile, touch and offline playback
        run: xvfb-run -a -s '-screen 0 1600x1100x24' npm run test:render
